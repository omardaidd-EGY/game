<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الغميضة 3D - النسخة الاحترافية PRO Max</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            padding: 12px 15px;
            border: 2px solid #0f0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            z-index: 100;
            pointer-events: none;
            line-height: 1.5;
        }
        
        #game-status {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffcc00;
            padding: 10px 25px;
            border: 2px solid #ffcc00;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
            text-align: center;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        #game-over-screen h1 {
            font-size: 40px;
            color: #ff3333;
            margin-bottom: 10px;
        }
        #game-over-screen p {
            font-size: 18px;
            margin-bottom: 10px;
        }
        #high-score-text {
            color: #ffcc00;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        #restart-btn {
            padding: 12px 30px;
            font-size: 18px;
            background: #0f0;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .touch-zone {
            display: none;
        }
        @media (max-width: 1024px), (pointer: coarse) {
            .touch-zone { display: block; }
        }

        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 1000;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 0, 0.6);
            border-radius: 50%;
        }

        .touch-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #0f0;
            color: #0f0;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
            touch-action: none;
        }
        #btn-jump { bottom: 30px; right: 30px; }
        #btn-sprint { bottom: 105px; right: 30px; }
        .touch-btn:active { background: rgba(0, 255, 0, 0.4); }

        #touch-look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            z-index: 500;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="game-status">
        <span id="status-text">اختبئ بسرعة!</span> - <span id="timer">15</span>s
    </div>

    <div id="info">
        <div>غميضة 3D (PRO Max)</div>
        <div>النقاط: <span id="score">0</span></div>
        <div>X: <span id="posX">0</span></div>
        <div>Y: <span id="posY">0</span></div>
        <div>Z: <span id="posZ">0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <div id="game-over-screen">
        <h1>تم الإمساك بك! 🙈</h1>
        <p id="final-score">صمدت لمدة: 0 ثانية</p>
        <p id="high-score-text">أعلى رقم قياسي: 0 ثانية</p>
        <button id="restart-btn" onclick="resetGame()">إعادة اللعب 🔄</button>
    </div>

    <div id="joystick-container" class="touch-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="touch-look-zone" class="touch-zone"></div>
    <div id="btn-jump" class="touch-btn touch-zone">قفز</div>
    <div id="btn-sprint" class="touch-btn touch-zone">ركض</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x6ba4d6);
        scene.fog = new THREE.FogExp2(0x6ba4d6, 0.0012);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const keys = {};
        let playerVelocity = new THREE.Vector3();
        let canJump = true;
        let yaw = 0;
        let pitch = 0;
        let headBobTimer = 0;

        let gameState = 'hiding';
        let hideTime = 15;
        let survivedTime = 0;
        let highScore = localStorage.getItem('hide_seek_highscore_pro') || 0;
        let timerInterval = null;
        let baseSeekerSpeed = 0.25;

        const colliders = [];

        // التحكم بلوحة المفاتيح
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && canJump && gameState !== 'caught') {
                playerVelocity.y = 0.45;
                canJump = false;
            }
        });

        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement && gameState !== 'caught') {
                yaw -= e.movementX * 0.0025;
                pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch - e.movementY * 0.0025));
            }
        });

        renderer.domElement.addEventListener('click', () => {
            if (!('ontouchstart' in window) && gameState !== 'caught') {
                renderer.domElement.requestPointerLock();
            }
        });

        // ------------------ تحكم اللمس ------------------
        let touchMoveVector = { x: 0, y: 0 };
        let isSprintingTouch = false;
        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickTouchId = null;

        joystickContainer.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            updateJoystick(touch);
        });

        joystickContainer.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) updateJoystick(touch);
            }
        });

        const resetJoystick = () => {
            joystickTouchId = null;
            touchMoveVector = { x: 0, y: 0 };
            joystickKnob.style.top = '35px';
            joystickKnob.style.left = '35px';
        };

        joystickContainer.addEventListener('touchend', resetJoystick);
        joystickContainer.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(touch) {
            const rect = joystickContainer.getBoundingClientRect();
            let deltaX = touch.clientX - (rect.left + rect.width / 2);
            let deltaY = touch.clientY - (rect.top + rect.height / 2);
            const distance = Math.hypot(deltaX, deltaY);
            const maxRadius = 40;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickKnob.style.left = `${35 + deltaX}px`;
            joystickKnob.style.top = `${35 + deltaY}px`;

            touchMoveVector.x = deltaX / maxRadius;
            touchMoveVector.y = deltaY / maxRadius;
        }

        const touchLookZone = document.getElementById('touch-look-zone');
        let lookTouchId = null;
        let lastTouchPos = { x: 0, y: 0 };

        touchLookZone.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            lookTouchId = touch.identifier;
            lastTouchPos = { x: touch.clientX, y: touch.clientY };
        });

        touchLookZone.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId && gameState !== 'caught') {
                    const deltaX = touch.clientX - lastTouchPos.x;
                    const deltaY = touch.clientY - lastTouchPos.y;

                    yaw -= deltaX * 0.004;
                    pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch - deltaY * 0.004));

                    lastTouchPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        });

        touchLookZone.addEventListener('touchend', () => { lookTouchId = null; });

        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (canJump && gameState !== 'caught') {
                playerVelocity.y = 0.45;
                canJump = false;
            }
        });

        document.getElementById('btn-sprint').addEventListener('touchstart', (e) => {
            e.preventDefault();
            isSprintingTouch = !isSprintingTouch;
            document.getElementById('btn-sprint').style.background = isSprintingTouch ? 'rgba(0, 255, 0, 0.5)' : 'rgba(0, 0, 0, 0.6)';
        });

        // ------------------ البيئة والإضاءة ------------------
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(2500, 2500),
            new THREE.MeshStandardMaterial({ color: 0x2e5a27, roughness: 0.85 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x223322, 0.5);
        hemiLight.position.set(0, 400, 0);
        scene.add(hemiLight);

        const sun = new THREE.DirectionalLight(0xfffaed, 1.3);
        sun.position.set(300, 500, 200);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 1200;
        const d = 600;
        sun.shadow.camera.left = -d;
        sun.shadow.camera.right = d;
        sun.shadow.camera.top = d;
        sun.shadow.camera.bottom = -d;
        scene.add(sun);

        // بناء بيوت واقعية PRO Max مع تفاصيل النوافذ والأسقف
        function createBuilding(x, z, w, d, h, color) {
            const buildingGroup = new THREE.Group();

            // الجسم الأساسي للمبنى
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 })
            );
            body.position.y = h / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            buildingGroup.add(body);

            // سقف مائل مع إطار
            const roof = new THREE.Mesh(
                new THREE.BoxGeometry(w + 0.8, 1.0, d + 0.8),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 })
            );
            roof.position.y = h + 0.5;
            roof.castShadow = true;
            buildingGroup.add(roof);

            // إضافة نوافذ متوهجة واقعية على الجدران
            const windowMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
            for (let wx = -w/3; wx <= w/3; wx += w/2) {
                if(wx === 0 && w < 10) continue;
                const win = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.1), windowMat);
                win.position.set(wx, h * 0.6, d / 2 + 0.05);
                buildingGroup.add(win);
            }

            buildingGroup.position.set(x, 0, z);
            scene.add(buildingGroup);

            colliders.push({
                type: 'box',
                minX: x - w / 2,
                maxX: x + w / 2,
                minZ: z - d / 2,
                maxZ: z + d / 2
            });
        }

        // إنشاء أشجار صنوبرية كثيفة واقعية PRO
        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            
            const trunkRadius = 0.7;
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(trunkRadius * 0.7, trunkRadius, 6, 8),
                new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.9 })
            );
            trunk.position.y = 3;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x0f3b18, roughness: 0.8 });
            
            // طبقات الأوراق المخروطية المتعددة
            const tier1 = new THREE.Mesh(new THREE.ConeGeometry(4.2, 5.5, 8), leavesMat);
            tier1.position.y = 5;
            tier1.castShadow = true;
            treeGroup.add(tier1);

            const tier2 = new THREE.Mesh(new THREE.ConeGeometry(3.2, 4.5, 8), leavesMat);
            tier2.position.y = 7.5;
            tier2.castShadow = true;
            treeGroup.add(tier2);

            const tier3 = new THREE.Mesh(new THREE.ConeGeometry(2.0, 3.5, 8), leavesMat);
            tier3.position.y = 9.8;
            tier3.castShadow = true;
            treeGroup.add(tier3);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);

            colliders.push({
                type: 'cylinder',
                x: x,
                z: z,
                radius: trunkRadius * 1.5
            });
        }

        // توليد الخريطة البيئية
        const buildingColors = [0x7a3b3b, 0x3b5f7a, 0x7a653b, 0x4a6b3b, 0x454545];
        for (let i = 0; i < 70; i++) {
            const x = (Math.random() - 0.5) * 1800;
            const z = (Math.random() - 0.5) * 1800;
            if (Math.hypot(x, z) > 40) {
                const w = 10 + Math.random() * 14;
                const d = 10 + Math.random() * 14;
                const h = 12 + Math.random() * 20;
                const col = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                createBuilding(x, z, w, d, h, col);
            }
        }

        for (let i = 0; i < 120; i++) {
            const x = (Math.random() - 0.5) * 1800;
            const z = (Math.random() - 0.5) * 1800;
            if (Math.hypot(x, z) > 40) {
                createTree(x, z);
            }
        }

        // ------------------ مجسم الصائد (إنسان شرير مرعب PRO Max) ------------------
        const seekerGroup = new THREE.Group();
        
        const coatMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0x242424, roughness: 0.8 });
        const redGlow = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        // الجسم / المعطف الطويل
        const seekerTorso = new THREE.Mesh(
            new THREE.CylinderGeometry(0.75, 1.0, 3.0, 12),
            coatMat
        );
        seekerTorso.position.y = 2.4;
        seekerTorso.castShadow = true;
        seekerGroup.add(seekerTorso);

        // الرأس
        const seekerHead = new THREE.Mesh(
            new THREE.SphereGeometry(0.8, 16, 16),
            skinMat
        );
        seekerHead.position.y = 4.4;
        seekerHead.castShadow = true;
        seekerGroup.add(seekerHead);

        // قلنسوة / غطاء رأس مرعب
        const hood = new THREE.Mesh(
            new THREE.ConeGeometry(0.95, 1.4, 8),
            coatMat
        );
        hood.position.y = 4.9;
        seekerGroup.add(hood);

        // عيون شريرة مضيئة
        const eyeGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const seekerLeftEye = new THREE.Mesh(eyeGeo, redGlow);
        seekerLeftEye.position.set(-0.28, 4.4, 0.65);
        const seekerRightEye = new THREE.Mesh(eyeGeo, redGlow);
        seekerRightEye.position.set(0.28, 4.4, 0.65);
        seekerGroup.add(seekerLeftEye);
        seekerGroup.add(seekerRightEye);

        // الأذرع المتحركة
        const armGeo = new THREE.CylinderGeometry(0.22, 0.22, 2.4, 8);
        const leftArm = new THREE.Mesh(armGeo, coatMat);
        leftArm.name = 'leftArm';
        leftArm.position.set(-1.0, 2.6, 0);
        seekerGroup.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, coatMat);
        rightArm.name = 'rightArm';
        rightArm.position.set(1.0, 2.6, 0);
        seekerGroup.add(rightArm);

        // الأرجل
        const legGeo = new THREE.CylinderGeometry(0.28, 0.28, 2.5, 8);
        const leftLeg = new THREE.Mesh(legGeo, coatMat);
        leftLeg.position.set(-0.4, 1.0, 0);
        seekerGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, coatMat);
        rightLeg.position.set(0.4, 1.0, 0);
        seekerGroup.add(rightLeg);

        // مصباح كشاف الصائد المرعب
        const seekerSpotlight = new THREE.SpotLight(0xff1111, 4.0, 140, Math.PI / 4, 0.4);
        seekerSpotlight.position.set(0, 4.2, 0.5);
        seekerSpotlight.target.position.set(0, 0, 30);
        seekerGroup.add(seekerSpotlight);
        seekerGroup.add(seekerSpotlight.target);

        seekerGroup.position.set(0, 0, -120);
        scene.add(seekerGroup);

        // ------------------ دالة فحص التصادم ------------------
        function checkCollision(pos, radius) {
            for (let col of colliders) {
                if (col.type === 'box') {
                    const closestX = Math.max(col.minX, Math.min(pos.x, col.maxX));
                    const closestZ = Math.max(col.minZ, Math.min(pos.z, col.maxZ));
                    const distX = pos.x - closestX;
                    const distZ = pos.z - closestZ;
                    if (Math.hypot(distX, distZ) < radius) return true;
                } else if (col.type === 'cylinder') {
                    const distX = pos.x - col.x;
                    const distZ = pos.z - col.z;
                    if (Math.hypot(distX, distZ) < (radius + col.radius)) return true;
                }
            }
            return false;
        }

        // ------------------ نظام الوقت واللعبة ------------------
        function startTimer() {
            clearInterval(timerInterval);
            hideTime = 15;
            survivedTime = 0;
            baseSeekerSpeed = 0.25;
            gameState = 'hiding';

            document.getElementById('status-text').textContent = 'اختبئ بسرعة!';
            document.getElementById('status-text').style.color = '#ffcc00';
            document.getElementById('game-status').style.borderColor = '#ffcc00';
            document.getElementById('timer').textContent = hideTime;
            document.getElementById('score').textContent = 0;

            timerInterval = setInterval(() => {
                if (gameState === 'hiding') {
                    hideTime--;
                    document.getElementById('timer').textContent = hideTime;
                    if (hideTime <= 0) {
                        gameState = 'seeking';
                        document.getElementById('status-text').textContent = 'الصائد الشرير يطاردك الآن!';
                        document.getElementById('status-text').style.color = '#ff3333';
                        document.getElementById('game-status').style.borderColor = '#ff3333';
                    }
                } else if (gameState === 'seeking') {
                    survivedTime++;
                    document.getElementById('timer').textContent = `${survivedTime}s صمود`;
                    document.getElementById('score').textContent = survivedTime * 10;
                    
                    baseSeekerSpeed += 0.005;
                }
            }, 1000);
        }

        function resetGame() {
            document.getElementById('game-over-screen').style.display = 'none';
            camera.position.set(0, 3, 0);
            seekerGroup.position.set(0, 0, -140);
            yaw = 0;
            pitch = 0;
            startTimer();
        }

        startTimer();

        // ------------------ حلقة التحديث الرئيسية ------------------
        let fps = 0;
        let lastTime = Date.now();
        let walkCycle = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (gameState !== 'caught') {
                const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'] || isSprintingTouch;
                const speed = isSprinting ? 0.42 : 0.22;

                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                let moveDelta = new THREE.Vector3();

                if (keys['KeyW'] || keys['ArrowUp']) moveDelta.addScaledVector(forward, speed);
                if (keys['KeyS'] || keys['ArrowDown']) moveDelta.addScaledVector(forward, -speed);
                if (keys['KeyA'] || keys['ArrowLeft']) moveDelta.addScaledVector(right, -speed);
                if (keys['KeyD'] || keys['ArrowRight']) moveDelta.addScaledVector(right, speed);

                if (touchMoveVector.x !== 0 || touchMoveVector.y !== 0) {
                    moveDelta.addScaledVector(right, touchMoveVector.x * speed);
                    moveDelta.addScaledVector(forward, -touchMoveVector.y * speed);
                }

                const playerRadius = 0.8;
                const oldPos = camera.position.clone();

                camera.position.x += moveDelta.x;
                if (checkCollision(camera.position, playerRadius)) camera.position.x = oldPos.x;

                camera.position.z += moveDelta.z;
                if (checkCollision(camera.position, playerRadius)) camera.position.z = oldPos.z;

                const isMoving = moveDelta.lengthSq() > 0;

                playerVelocity.y -= 0.02;
                camera.position.y += playerVelocity.y;

                if (isMoving && canJump) {
                    headBobTimer += isSprinting ? 0.25 : 0.15;
                    camera.position.y = 2 + Math.sin(headBobTimer) * 0.1;
                } else if (camera.position.y <= 2) {
                    camera.position.y = 2;
                    playerVelocity.y = 0;
                    canJump = true;
                }

                camera.position.x = Math.max(-1100, Math.min(1100, camera.position.x));
                camera.position.z = Math.max(-1100, Math.min(1100, camera.position.z));

                const direction = new THREE.Vector3(0, 0, -1)
                    .applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch)
                    .applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.lookAt(camera.position.clone().add(direction));

                // ذكاء اصطناعي للصائد الشرير مع حركة واقعية
                if (gameState === 'seeking') {
                    const dirToPlayer = new THREE.Vector3().subVectors(camera.position, seekerGroup.position);
                    dirToPlayer.y = 0;
                    const distance = dirToPlayer.length();

                    let currentSeekerSpeed = baseSeekerSpeed;
                    if (distance < 35) {
                        currentSeekerSpeed += 0.09; // اندفاع مرعب عند الاقتراب
                    }

                    if (distance > 1) {
                        dirToPlayer.normalize();
                        const nextSeekerPos = seekerGroup.position.clone().addScaledVector(dirToPlayer, currentSeekerSpeed);

                        if (!checkCollision(nextSeekerPos, 1.2)) {
                            seekerGroup.position.copy(nextSeekerPos);
                        } else {
                            const slidePos = seekerGroup.position.clone().addScaledVector(dirToPlayer, currentSeekerSpeed * 0.5);
                            slidePos.x += (Math.random() - 0.5) * 0.3;
                            if (!checkCollision(slidePos, 1.2)) {
                                seekerGroup.position.copy(slidePos);
                            }
                        }

                        seekerGroup.lookAt(camera.position.x, seekerGroup.position.y, camera.position.z);

                        // تحريك الأذرع أثناء المطاردة
                        walkCycle += 0.15;
                        const lArm = seekerGroup.getObjectByName('leftArm');
                        const rArm = seekerGroup.getObjectByName('rightArm');
                        if(lArm && rArm) {
                            lArm.rotation.x = Math.sin(walkCycle) * 0.6;
                            rArm.rotation.x = -Math.sin(walkCycle) * 0.6;
                        }
                    }

                    // شرط الخسارة
                    if (distance < 2.8) {
                        gameState = 'caught';
                        clearInterval(timerInterval);
                        document.exitPointerLock();

                        if (survivedTime > highScore) {
                            highScore = survivedTime;
                            localStorage.setItem('hide_seek_highscore_pro', highScore);
                        }

                        document.getElementById('final-score').textContent = `صمدت لمدة: ${survivedTime} ثانية (${survivedTime * 10} نقطة)`;
                        document.getElementById('high-score-text').textContent = `أعلى رقم قياسي: ${highScore} ثانية`;
                        document.getElementById('game-over-screen').style.display = 'flex';
                    }
                }
            }

            document.getElementById('posX').textContent = camera.position.x.toFixed(1);
            document.getElementById('posY').textContent = camera.position.y.toFixed(1);
            document.getElementById('posZ').textContent = camera.position.z.toFixed(1);

            fps++;
            if (Date.now() - lastTime >= 1000) {
                document.getElementById('fps').textContent = fps;
                fps = 0;
                lastTime = Date.now();
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
