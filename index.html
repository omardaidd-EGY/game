<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>????? 3D - ???? ???????</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            border: 1px solid #0f0;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
        }
        
        /* ????? ???? ??????? */
        .touch-zone {
            display: none;
        }
        @media (max-width: 1024px), (pointer: coarse) {
            .touch-zone { display: block; }
        }

        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 1000;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 0, 0.6);
            border-radius: 50%;
        }

        .touch-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #0f0;
            color: #0f0;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
            touch-action: none;
        }
        #btn-jump { bottom: 30px; right: 30px; }
        #btn-sprint { bottom: 105px; right: 30px; }
        .touch-btn:active { background: rgba(0, 255, 0, 0.4); }

        #touch-look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            z-index: 500;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <div>?? ????? 3D</div>
        <div>X: <span id="posX">0</span></div>
        <div>Y: <span id="posY">0</span></div>
        <div>Z: <span id="posZ">0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <div id="joystick-container" class="touch-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="touch-look-zone" class="touch-zone"></div>
    <div id="btn-jump" class="touch-btn touch-zone">???</div>
    <div id="btn-sprint" class="touch-btn touch-zone">???</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 200, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 3, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ???? ?????? ????????? (???????? code ?????? ??? ??????? ?? ????? ???????)
        const keys = {};
        let playerVelocity = new THREE.Vector3();
        let canJump = true;
        let yaw = 0;
        let pitch = 0;

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && canJump) {
                playerVelocity.y = 0.4;
                canJump = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // ???? ??????
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.003;
                pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch - e.movementY * 0.003));
            }
        });

        renderer.domElement.addEventListener('click', () => {
            if (!('ontouchstart' in window)) {
                renderer.domElement.requestPointerLock();
            }
        });

        // ------------------ ????? ???? ????? (??????) ------------------
        let touchMoveVector = { x: 0, y: 0 };
        let isSprintingTouch = false;
        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickTouchId = null;

        joystickContainer.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            updateJoystick(touch);
        });

        joystickContainer.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) {
                    updateJoystick(touch);
                }
            }
        });

        const resetJoystick = () => {
            joystickTouchId = null;
            touchMoveVector = { x: 0, y: 0 };
            joystickKnob.style.top = '35px';
            joystickKnob.style.left = '35px';
        };

        joystickContainer.addEventListener('touchend', resetJoystick);
        joystickContainer.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(touch) {
            const rect = joystickContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);
            const maxRadius = 40;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickKnob.style.left = `${35 + deltaX}px`;
            joystickKnob.style.top = `${35 + deltaY}px`;

            touchMoveVector.x = deltaX / maxRadius;
            touchMoveVector.y = deltaY / maxRadius;
        }

        // ???????? ?????? (????? ??? ?????? ??????)
        const touchLookZone = document.getElementById('touch-look-zone');
        let lookTouchId = null;
        let lastTouchPos = { x: 0, y: 0 };

        touchLookZone.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            lookTouchId = touch.identifier;
            lastTouchPos = { x: touch.clientX, y: touch.clientY };
        });

        touchLookZone.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) {
                    const deltaX = touch.clientX - lastTouchPos.x;
                    const deltaY = touch.clientY - lastTouchPos.y;

                    yaw -= deltaX * 0.005;
                    pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch - deltaY * 0.005));

                    lastTouchPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        });

        const resetLookTouch = () => { lookTouchId = null; };
        touchLookZone.addEventListener('touchend', resetLookTouch);
        touchLookZone.addEventListener('touchcancel', resetLookTouch);

        // ????? ?????
        const btnJump = document.getElementById('btn-jump');
        const btnSprint = document.getElementById('btn-sprint');

        btnJump.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (canJump) {
                playerVelocity.y = 0.4;
                canJump = false;
            }
        });

        btnSprint.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isSprintingTouch = !isSprintingTouch;
            btnSprint.style.background = isSprintingTouch ? 'rgba(0, 255, 0, 0.5)' : 'rgba(0, 0, 0, 0.6)';
        });

        // ------------------ ???? ?????? ------------------
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x2d8f2d });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const grid = new THREE.GridHelper(500, 50, 0x444444, 0x888888);
        grid.position.y = 0.01;
        scene.add(grid);

        function createTree(x, z) {
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.7, 4, 8),
                new THREE.MeshLambertMaterial({ color: 0x8b4513 })
            );
            trunk.position.set(x, 2, z);
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            scene.add(trunk);

            const leaves = new THREE.Mesh(
                new THREE.SphereGeometry(3, 8, 8),
                new THREE.MeshLambertMaterial({ color: 0x228b22 })
            );
            leaves.position.set(x, 6, z);
            leaves.castShadow = true;
            leaves.receiveShadow = true;
            scene.add(leaves);
        }

        for (let i = 0; i < 20; i++) {
            createTree(Math.random() * 200 - 100, Math.random() * 200 - 100);
        }

        function createBuilding(x, z, w, d, h, col) {
            const building = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshLambertMaterial({ color: col })
            );
            building.position.set(x, h / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
        }

        createBuilding(0, 0, 10, 10, 8, 0xff6347);
        createBuilding(-30, -30, 8, 8, 6, 0x4169e1);
        createBuilding(30, 30, 8, 8, 6, 0xffa500);

        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(100, 100, 50);
        sun.castShadow = true;
        scene.add(sun);

        // ------------------ ???? ?????? ???????? ------------------
        let fps = 0;
        let lastTime = Date.now();

        function animate() {
            requestAnimationFrame(animate);

            // ????? ??????
            const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'] || isSprintingTouch;
            const speed = isSprinting ? 0.35 : 0.18;

            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            // ?????? ??? ???? ????????
            if (keys['KeyW']) camera.position.addScaledVector(forward, speed);
            if (keys['KeyS']) camera.position.addScaledVector(forward, -speed);
            if (keys['KeyA']) camera.position.addScaledVector(right, -speed);
            if (keys['KeyD']) camera.position.addScaledVector(right, speed);

            // ?????? ??? ????? (????? ??????????)
            if (touchMoveVector.x !== 0 || touchMoveVector.y !== 0) {
                camera.position.addScaledVector(right, touchMoveVector.x * speed);
                camera.position.addScaledVector(forward, -touchMoveVector.y * speed);
            }

            // ????????
            playerVelocity.y -= 0.018;
            camera.position.y += playerVelocity.y;

            if (camera.position.y <= 2) {
                camera.position.y = 2;
                playerVelocity.y = 0;
                canJump = true;
            }

            // ???? ??????
            camera.position.x = Math.max(-240, Math.min(240, camera.position.x));
            camera.position.z = Math.max(-240, Math.min(240, camera.position.z));

            // ????? ????? ????????
            const direction = new THREE.Vector3(0, 0, -1)
                .applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch)
                .applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            camera.lookAt(camera.position.clone().add(direction));

            // ????? ???????
            document.getElementById('posX').textContent = camera.position.x.toFixed(1);
            document.getElementById('posY').textContent = camera.position.y.toFixed(1);
            document.getElementById('posZ').textContent = camera.position.z.toFixed(1);

            fps++;
            if (Date.now() - lastTime >= 1000) {
                document.getElementById('fps').textContent = fps;
                fps = 0;
                lastTime = Date.now();
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
